name: Build Zeta APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev build-essential libffi-dev git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libmstream0d curl
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Create buildozer.spec
        run: |
          ~/.local/bin/buildozer init
          sed -i 's/^title = .*/title = Zeta AI/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = zetaai/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,pyjnius/' buildozer.spec
          sed -i 's/#android.permissions = .*/android.permissions = INTERNET, ACCESS_FINE_LOCATION/' buildozer.spec

      - name: Package with Buildozer
        run: |
          yes | ~/.local/bin/buildozer android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeta-Android-APK
          path: bin/*.apk
          
