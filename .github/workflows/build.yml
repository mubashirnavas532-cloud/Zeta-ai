name: Build Zeta APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Auto-Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | th_sdk_path="" # Buildozer handles its path locally, we pass generic hooks
          # This command injects auto-acceptance directly into Buildozer's engine environment variables
          echo "y" | buildozer android debug || true
          # The block above handles licenses initialization. The actual stable clean build runs below.

      - name: Run Buildozer Compilation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Force buildozer engine to auto-accept licenses via environmental flags
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeta-Android-APK
          path: bin/*.apk
          
